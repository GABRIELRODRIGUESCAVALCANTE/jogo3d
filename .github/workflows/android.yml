# Gera o APK Android (versão de teste, "debug") com o Capacitor.
# Rode manualmente em Actions → "APK Android" → "Run workflow", ou crie uma tag v1.0.0.
# O APK fica disponível para download na página da execução (seção "Artifacts").
name: APK Android

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['**']
    paths:
      - '.github/workflows/android.yml'
      - 'capacitor.config.json'

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências e gerar o jogo
        run: |
          npm ci
          npm run build

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Preparar o Android SDK (plataforma 36)
        run: |
          # Usa o SDK do runner; se não houver, baixa as ferramentas oficiais do Google.
          if [ -z "$ANDROID_HOME" ] || [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            export ANDROID_HOME="$HOME/android-sdk"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -sSL -o /tmp/tools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            unzip -q /tmp/tools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Criar o projeto Android (Capacitor)
        run: |
          npx cap add android
          npx cap sync android
          # Jogo sempre na horizontal.
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml

      - name: Ícone do jogo
        run: |
          IM=$(command -v magick || command -v convert || true)
          if [ -z "$IM" ]; then echo "ImageMagick indisponível: mantendo o ícone padrão"; exit 0; fi
          res=android/app/src/main/res
          icon=public/assets/icons/icon-512.png
          for pair in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            IFS=: read dpi size fg <<< "$pair"
            "$IM" "$icon" -resize ${size}x${size} "$res/mipmap-$dpi/ic_launcher.png"
            "$IM" "$icon" -resize ${size}x${size} "$res/mipmap-$dpi/ic_launcher_round.png"
            "$IM" "$icon" -resize $((fg * 66 / 100))x$((fg * 66 / 100)) -background none -gravity center -extent ${fg}x${fg} "$res/mipmap-$dpi/ic_launcher_foreground.png"
          done

      - name: Compilar o APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: alem-do-horizonte-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
