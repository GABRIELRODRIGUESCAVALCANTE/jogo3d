# Verificação automática: roda a cada push e em pull requests.
# Confere os tipos, os testes de lógica, o build e joga o jogo num navegador.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipos (TypeScript)
        run: npm run typecheck

      - name: Testes de lógica (Vitest)
        run: npm test

      - name: Build de produção
        run: npm run build

      - name: Instalar navegador para os testes
        run: npx playwright install --with-deps chromium

      - name: Testes de ponta a ponta (Playwright)
        run: npm run test:e2e

      - name: Guardar relatório dos testes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-playwright
          path: playwright-report/
          retention-days: 7
